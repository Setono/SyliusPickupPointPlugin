setono_sylius_pickup_point:
    providers:
        faker: true
        gls: true

sylius_fixtures:
    suites:
        default:
            fixtures:
                geographical:
                    options:
                        countries:
                            - 'DK'
                            - 'SE'
                            - 'FI'
                            - 'US'
                            - 'FR'
                            - 'DE'
                            - 'AU'
                            - 'CA'
                            - 'MX'
                            - 'NZ'
                            - 'PT'
                            - 'ES'
                            - 'CN'
                        zones:
                            WORLD:
                                name: 'World'
                                countries:
                                    - 'DK'
                                    - 'SE'
                                    - 'FI'
                                    - 'US'
                                    - 'FR'
                                    - 'DE'
                                    - 'AU'
                                    - 'CA'
                                    - 'MX'
                                    - 'NZ'
                                    - 'PT'
                                    - 'ES'
                                    - 'CN'

                # Force orders to be fully fulfilled so they always have shipments. The default (non-fulfilled)
                # order fixture leaves orders in random checkout states, occasionally producing zero shipments —
                # which made the admin order-show functional test (it needs a shipment) flaky.
                order:
                    options:
                        amount: 20
                        channel: 'FASHION_WEB'
                        fulfilled: true

                setono_sylius_pickup_point_shipping_method:
                    options:
                        custom:
                            faker:
                                code: "faker"
                                name: "Fake delivery"
                                enabled: true
                                zone: "WORLD"
                                pickup_point_provider: faker
                                channels:
                                    - "FASHION_WEB"
                            gls:
                                code: "gls"
                                name: "GLS pickup"
                                enabled: true
                                zone: "WORLD"
                                pickup_point_provider: gls
                                channels:
                                    - "FASHION_WEB"
