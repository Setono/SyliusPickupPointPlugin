name: "build"

on:
    push: ~
    pull_request: ~
    workflow_dispatch: ~

jobs:
    coding-standards:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/coding-standards@v2"

    dependency-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/dependency-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"

    static-code-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/static-code-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"

    unit-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/unit-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    testsuite: "unit"

    code-coverage:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/code-coverage@v2"
                with:
                    # Covers the unit suite (the action runs phpunit with pcov + uploads to Codecov); the
                    # functional suite is excluded because it needs a database this job does not provision.
                    # CODECOV_TOKEN must be set in the repository secrets.
                    codecov-token: "${{ secrets.CODECOV_TOKEN }}"
                    testsuite: "unit"

    functional-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4"]
                dependencies: ["highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/functional-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    testsuite: "functional"

    javascript-tests:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "actions/checkout@v4"
            # The chooser JS unit tests live in tests/Application, whose package.json has file: deps on the
            # installed Sylius/Symfony assets — so PHP + a composer install are needed to populate vendor/
            # before yarn can resolve them.
            -   uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.4"
                    extensions: "intl, mbstring"
                    coverage: "none"
            -   uses: "ramsey/composer-install@v4"
            -   uses: "actions/setup-node@v4"
                with:
                    node-version: "22"
            -   run: "yarn --cwd tests/Application install"
            -   run: "yarn --cwd tests/Application test"
